<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cartão Principal -->
    <div class="card">
        <h2 class="titulo">PAINEL DIGITAL</h2>

        <!-- Relógio Principal -->
        <h1 class="horario" id="horario">14:30:25</h1>

        <!-- Data Completa -->
        <p class="data-completa" id="data-completa">10/09/2026</p>

        <!-- Caixas Separadas: DIA, MÊS, ANO -->
        <div class="caixas-data">
            <div class="caixa">
                <span>DIA</span>
                <p id="dia">10</p>
            </div>
            <div class="caixa">
                <span>MÊS</span>
                <p id="mes">09</p>
            </div>
            <div class="caixa">
                <span>ANO</span>
                <p id="ano">2026</p>
            </div>
        </div>

        <!-- Mensagem de Saudação -->
        <div class="saudacao" id="saudacao">
            BOA TARDE!
        </div>

        <!-- Rodapé do Card -->
        <p class="status">• PAINEL ATUALIZADO AUTOMATICAMENTE</p>
    </div>



<script src="js/script.js"></script>

</body>
</html>
